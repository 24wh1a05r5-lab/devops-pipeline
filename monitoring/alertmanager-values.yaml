# helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack -n monitoring -f this-file
alertmanager:
  config:
    route: { receiver: slack, group_by: [alertname, namespace] }
    receivers:
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack/url   # mount from a Secret
            channel: "#deployments"
            send_resolved: true
