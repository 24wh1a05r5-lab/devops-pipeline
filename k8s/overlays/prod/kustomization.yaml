apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-prod
resources:
  - ../../base
  - namespace.yaml
images:
  - name: app
    newName: ghcr.io/OWNER/devops-pipeline   # TODO: your GitHub user/org
    newTag: latest                           # rewritten by the deploy workflows
configMapGenerator:
  - name: app-config
    behavior: merge
    literals: [APP_ENV=prod]
patches:
  - target: { kind: Deployment, name: app }
    patch: |-
      - { op: replace, path: /spec/replicas, value: 3 }
      - { op: replace, path: /spec/template/spec/containers/0/resources/limits/memory, value: 512Mi }
  - target: { kind: HorizontalPodAutoscaler, name: app }
    patch: |-
      - { op: replace, path: /spec/minReplicas, value: 3 }
      - { op: replace, path: /spec/maxReplicas, value: 10 }
  - target: { kind: Ingress, name: app }
    patch: |-
      - { op: replace, path: /spec/rules/0/host, value: app.example.com }
