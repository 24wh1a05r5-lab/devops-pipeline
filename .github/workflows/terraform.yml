name: Terraform
on:
  pull_request:
    paths: [terraform/**]
  workflow_dispatch:
    inputs:
      env: { description: "dev | staging | prod", required: true, default: dev }
      apply: { description: "Apply? (true/false)", required: true, default: "false" }

permissions: { id-token: write, contents: read, pull-requests: write }

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with: { directory: terraform, framework: terraform, soft_fail: true }

  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix: { env: [dev, staging, prod] }
    defaults: { run: { working-directory: "terraform/envs/${{ matrix.env }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4     # OIDC, no stored keys
        with: { role-to-assume: "${{ vars.AWS_ROLE_ARN }}", aws-region: ap-south-1 }
      - run: terraform fmt -check -recursive ../../
      - run: terraform init
      - run: terraform validate
      - run: terraform plan -var-file=terraform.tfvars -no-color

  apply:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env }}      # prod requires reviewers
    defaults: { run: { working-directory: "terraform/envs/${{ github.event.inputs.env }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_ROLE_ARN }}", aws-region: ap-south-1 }
      - run: terraform init && terraform apply -auto-approve -var-file=terraform.tfvars
