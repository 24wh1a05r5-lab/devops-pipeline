# GitOps: CI success on develop -> bump image tag in dev overlay -> Argo CD syncs.
name: Deploy Dev
on:
  workflow_run:
    workflows: [CI]
    branches: [develop]
    types: [completed]

concurrency: gitops-develop
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: develop }
      - name: Bump dev image tag
        working-directory: k8s/overlays/dev
        run: kustomize edit set image app=ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}
      - name: Commit
        run: |
          git config user.name "deploy-bot"; git config user.email "deploy-bot@users.noreply.github.com"
          git commit -am "deploy(dev): ${{ github.event.workflow_run.head_sha }}" && git push
